# Static server for the exported site, mirroring how GitHub Pages serves it.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Next's export writes its own 404 page; use it rather than nginx's.
    error_page 404 /404.html;

    # Hashed build assets are immutable, so they can be cached hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The firmware is large and re-published under the same name, so it must
    # revalidate rather than serve a stale image from cache.
    location /firmware/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
